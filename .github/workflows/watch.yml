name: PUDLA снаружи
# Check of https://pudla.app from outside Timeweb, once a minute (see watch.sh).
# Each run lasts ~50 min; the schedule starts the next one; one at a time (the next waits, not cancels).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: bash watch.sh
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
